<script>
  // Elemento seguro: se não existir, devolve um objeto vazio (o motor de som original procurava elementos de um painel antigo)
  function el(id) {
    return document.getElementById(id) || { classList: { add(){}, remove(){}, replace(){} }, style: {} };
  }
const SoundSystem = (function() {
    let ctx = null;
    let masterGain = null;
    let ambientGain = null;
    let sfxGain = null;

    // Ambient loop nodes
    let windOsc = null;
    let windFilter = null;
    let oceanGain = null;
    let birdInterval = null;

    let isMuted = false;
    let isAmbientOn = true;
    let isSfxOn = true;
    let volumeLevel = 0.75;

    function initContext() {
      if (!ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioContext();

        // Master Gain
        masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(volumeLevel, ctx.currentTime);
        masterGain.connect(ctx.destination);

        // Sub gains
        ambientGain = ctx.createGain();
        ambientGain.gain.setValueAtTime(0.35, ctx.currentTime);
        ambientGain.connect(masterGain);

        sfxGain = ctx.createGain();
        sfxGain.gain.setValueAtTime(0.7, ctx.currentTime);
        sfxGain.connect(masterGain);

        startAmbientNature();
      }
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    // Gentle Oceanic Breeze + Laurissilva Forest Ambient
    function startAmbientNature() {
      if (!ctx || !isAmbientOn) return;

      // 1. Synthesize Pink Noise for ocean waves and breeze
      const bufferSize = ctx.sampleRate * 3;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
        b6 = white * 0.115926;
      }

      const noiseSource = ctx.createBufferSource();
      noiseSource.buffer = buffer;
      noiseSource.loop = true;

      windFilter = ctx.createBiquadFilter();
      windFilter.type = 'lowpass';
      windFilter.frequency.setValueAtTime(320, ctx.currentTime);

      // Low frequency oscillator (LFO) to create undulating ocean wave swell
      const lfo = ctx.createOscillator();
      lfo.frequency.setValueAtTime(0.18, ctx.currentTime); // ~5 second wave swell cycle
      const lfoGain = ctx.createGain();
      lfoGain.gain.setValueAtTime(220, ctx.currentTime);

      lfo.connect(lfoGain);
      lfoGain.connect(windFilter.frequency);
      lfo.start();

      oceanGain = ctx.createGain();
      oceanGain.gain.setValueAtTime(0.25, ctx.currentTime);

      noiseSource.connect(windFilter);
      windFilter.connect(oceanGain);
      oceanGain.connect(ambientGain);
      noiseSource.start();

      // 2. Periodic natural Freira-da-Madeira seabird / laurel bird chirps
      if (birdInterval) clearInterval(birdInterval);
      birdInterval = setInterval(() => {
        if (isAmbientOn && !isMuted && Math.random() > 0.3) {
          playNaturalBirdChirp();
        }
      }, 4800);
    }

    function stopAmbientNature() {
      if (oceanGain && ctx) {
        oceanGain.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
      }
      if (birdInterval) clearInterval(birdInterval);
    }

    // Natural seabird chirp (soft frequency glide in ambient mode)
    function playNaturalBirdChirp() {
      if (!ctx || !isAmbientOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';

      const baseFreq = 2200 + Math.random() * 600;
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq + 700, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(baseFreq - 200, now + 0.18);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gain);
      gain.connect(ambientGain);

      osc.start(now);
      osc.stop(now + 0.25);
    }

    // -----------------------------------------------------------
    // UI SOUND EFFECTS
    // -----------------------------------------------------------

    // 1. Button click / crisp tap
    function playClick() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.06);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

      osc.connect(gain);
      gain.connect(sfxGain);

      osc.start(now);
      osc.stop(now + 0.07);
    }

    // 2. Navigation Whoosh / Transition
    function playWhoosh() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.22);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc.connect(gain);
      gain.connect(sfxGain);

      osc.start(now);
      osc.stop(now + 0.25);
    }

    // 3. QR / Horizon Scan Beep
    function playScanBeep() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1760, now + 0.07);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(sfxGain);

      osc.start(now);
      osc.stop(now + 0.16);
    }

    // 4. Camera Shutter Click
    function playShutter() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;

      // Two mechanical clicks
      [0, 0.09].forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now + offset);
        osc.frequency.exponentialRampToValueAtTime(120, now + offset + 0.04);

        gain.gain.setValueAtTime(0.3, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.04);

        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(now + offset);
        osc.stop(now + offset + 0.05);
      });
    }

    // 5. Feather Collected Victory Fanfare (Sparkle Arpeggio Chord: C - E - G - B - C - E)
    function playFanfare() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51]; // C5, E5, G5, B5, C6, E6

      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const noteStart = now + (i * 0.07);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, noteStart);

        gain.gain.setValueAtTime(0.01, noteStart);
        gain.gain.linearRampToValueAtTime(0.22, noteStart + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.55);

        osc.connect(gain);
        gain.connect(sfxGain);

        osc.start(noteStart);
        osc.stop(noteStart + 0.6);
      });
    }

    // 6. Cute Freira Bird Chirp / Mascot interaction
    function playBirdChirp() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;

      [0, 0.1].forEach((delay, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';

        const t = now + delay;
        const startF = idx === 0 ? 1900 : 2300;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.exponentialRampToValueAtTime(startF + 900, t + 0.05);
        osc.frequency.exponentialRampToValueAtTime(startF + 300, t + 0.09);

        gain.gain.setValueAtTime(0.01, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);

        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(t);
        osc.stop(t + 0.11);
      });
    }

    // 7. Mechanical Compass Tone / Haptic Feedback
    function playCompassHaptic() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    // 8. Language switch chime
    function playChime() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(740, now);
      osc.frequency.exponentialRampToValueAtTime(1108.73, now + 0.1);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.24);
    }

    // 9. Pause Sound
    function playPause() {
      initContext();
      if (!isSfxOn || isMuted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.15);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    // -----------------------------------------------------------
    // HUD & STATE CONTROLLERS
    // -----------------------------------------------------------
    function setVolume(val) {
      initContext();
      volumeLevel = parseFloat(val);
      if (masterGain) {
        masterGain.gain.setValueAtTime(isMuted ? 0 : volumeLevel, ctx.currentTime);
      }
      el('hud-volume-pct').textContent = Math.round(volumeLevel * 100) + '%';
    }

    function toggleMasterMute() {
      initContext();
      isMuted = !isMuted;
      if (masterGain) {
        masterGain.gain.setValueAtTime(isMuted ? 0 : volumeLevel, ctx.currentTime);
      }

      const muteBtn = el('hud-mute-btn');
      const eqDisplay = el('hud-eq-display');
      const headerBadge = el('header-audio-badge');
      const headerLabel = el('header-audio-label');

      if (isMuted) {
        muteBtn.textContent = '🔇';
        eqDisplay.classList.remove('eq-active');
        headerBadge.classList.replace('text-emerald-700', 'text-slate-400');
        headerBadge.classList.replace('bg-emerald-50', 'bg-slate-100');
        headerLabel.textContent = 'Mudo';
      } else {
        muteBtn.textContent = '🔊';
        eqDisplay.classList.add('eq-active');
        headerBadge.classList.replace('text-slate-400', 'text-emerald-700');
        headerBadge.classList.replace('bg-slate-100', 'bg-emerald-50');
        headerLabel.textContent = 'Som ON';
        playClick();
      }
    }

    function toggleAmbient(forceVal) {
      initContext();
      isAmbientOn = (forceVal !== undefined) ? forceVal : !isAmbientOn;
      const stateLabel = el('hud-ambient-state');
      const optCheck = el('opt-ambient-toggle');

      if (isAmbientOn) {
        if (ambientGain) ambientGain.gain.setValueAtTime(0.35, ctx.currentTime);
        stateLabel.textContent = 'Ativo';
        stateLabel.className = 'text-[9px] text-emerald-400 font-semibold';
        if (optCheck) optCheck.checked = true;
        startAmbientNature();
        playClick();
      } else {
        if (ambientGain) ambientGain.gain.setValueAtTime(0, ctx.currentTime);
        stateLabel.textContent = 'Pausado';
        stateLabel.className = 'text-[9px] text-slate-400 font-semibold';
        if (optCheck) optCheck.checked = false;
        stopAmbientNature();
      }
    }

    function toggleSFX(forceVal) {
      initContext();
      isSfxOn = (forceVal !== undefined) ? forceVal : !isSfxOn;
      const stateLabel = el('hud-sfx-state');
      const optCheck = el('opt-sfx-toggle');

      if (isSfxOn) {
        if (sfxGain) sfxGain.gain.setValueAtTime(0.7, ctx.currentTime);
        stateLabel.textContent = 'Ativo';
        stateLabel.className = 'text-[9px] text-emerald-400 font-semibold';
        if (optCheck) optCheck.checked = true;
        playClick();
      } else {
        if (sfxGain) sfxGain.gain.setValueAtTime(0, ctx.currentTime);
        stateLabel.textContent = 'Desligado';
        stateLabel.className = 'text-[9px] text-slate-400 font-semibold';
        if (optCheck) optCheck.checked = false;
      }
    }

    return {
      init: initContext,
      playClick,
      playWhoosh,
      playScanBeep,
      playShutter,
      playFanfare,
      playBirdChirp,
      playCompassHaptic,
      playChime,
      playPause,
      setVolume,
      toggleMasterMute,
      toggleAmbient,
      toggleSFX
    };
  })();
</script>

let current = 'abertura';
let stack = [];

function go(id, opts = {}) {
  sfx(opts.sound || 'playClick');
  if (META[id].root) stack = [];
  else if (current !== id) stack.push(current);
  current = id;
  render();
}
function back() {
  sfx('playWhoosh');
  current = stack.pop() || 'mapa';
  render();
}
function jump(id) { stack = id === 'abertura' ? [] : ['mapa']; current = id; sfx('playClick'); render(); }

function render(keepScroll) {
  const vp = document.getElementById('vp');
  const y = vp.scrollTop;
  const m = META[current];
  vp.innerHTML = `<div class="fade-in">${SCREENS[current]()}</div>`;
  vp.scrollTop = keepScroll ? y : 0;
  document.getElementById('appbar').style.display = m.bar === false ? 'none' : '';
  document.getElementById('appbar-title').textContent = m.title;
  document.getElementById('btn-back').style.display = stack.length ? '' : 'none';
  vp.style.background = m.dark ? '#24343D' : '';
  document.getElementById('badge-penas').textContent = `🪶 ${penas()}/10`;
  document.getElementById('btn-sound').textContent = state.muted ? '🔇' : '🔊';
  renderNav(m.nav);
  renderStrip();
  save();
  try { history.replaceState(null, '', '#' + current); } catch (e) {}
}

function renderNav(active) {
  const nav = document.getElementById('bottomnav');
  if (!active) { nav.style.display = 'none'; return; }
  nav.style.display = '';
  const items = [
    ['mapa', '🧭', 'Mapa', "go('mapa')"],
    ['missoes', '✅', 'Missões', "go('epoca')"],
    ['penas', '🪶', 'Penas', "openCaderneta('penas')"],
    ['caderneta', '📖', 'Caderneta', "openCaderneta('premios')"],
    ['perfil', '👤', 'Perfil', "go('opcoes')"]
  ];
  nav.innerHTML = items.map(([k, i, l, fn]) => {
    const sel = k === 'penas' ? (active === 'caderneta' && state.cadTab === 'penas')
              : k === 'caderneta' ? (active === 'caderneta' && state.cadTab !== 'penas')
              : k === active;
    return `<button onclick="${fn}" class="py-2 flex flex-col items-center gap-0.5 ${sel ? 'text-primary' : ''}" ${sel ? 'aria-current="page"' : ''}>
      <span class="text-lg leading-none">${i}</span><span>${l}</span></button>`;
  }).join('');
}

function renderStrip() {
  const strip = document.getElementById('proto-strip');
  strip.innerHTML = `<span class="text-amber-400 font-bold px-2 py-1.5 shrink-0">Ecrãs:</span>` +
    Object.entries(META).map(([id, m]) =>
      `<button onclick="jump('${id}')" class="shrink-0 px-2.5 py-1.5 rounded-full font-semibold ${id === current ? 'bg-primary text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${m.code} · ${m.title}</button>`

    `<button onclick="resetProgress(true)" class="shrink-0 px-2.5 py-1.5 rounded-full font-semibold bg-terracotta-dark text-white">↺ Reiniciar demo</button>`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-3');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-3'), 2600);
}
function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal(e) { if (!e || e.target.id === 'modal' || e.target.dataset.close) document.getElementById('modal').classList.add('hidden'); }

const btn = (label, fn, cls = 'bg-primary hover:bg-primary-dark text-white') =>

const btn2 = (label, fn) => btn(label, fn, 'bg-primary-light hover:bg-sky-100 text-primary');
const progressBar = (n, total = 10, cls = 'bg-primary') =>

function openPlace(id) {
  state.mission = id;

function startCheckin(id) { state.mission = id || state.mission; go('checkin'); }

function toggleCat(c) {
  const i = state.cats.indexOf(c);
  i >= 0 ? state.cats.splice(i, 1) : state.cats.push(c);
  sfx('playClick'); render(true);
}
function toggleFilter(f) { state[f] = !state[f]; sfx('playClick'); render(true); }
function matches(p) {
  return (!state.cats.length || p.cats.some(c => state.cats.includes(c))) &&
         (!state.calmo || p.calmo) && (!state.kids || p.kids);
}
function presetFilter(cats, kids = false) { state.cats = cats; state.kids = kids; state.calmo = false; go('mapa'); }

function toggleTask(i) { state.tasks[i] = !state.tasks[i]; sfx(state.tasks[i] ? 'playChime' : 'playClick'); render(true); }

let scanning = false;
function validate(method) {
  if (scanning) return;
  scanning = true;
  if (method === 'qr') sfx('playScanBeep'); else sfx('playCompassHaptic');
  render(true);
  setTimeout(() => { scanning = false; doValidate(method); }, method === 'qr' ? 1600 : 900);
}
function doValidate(method) {
  const id = state.mission, p = PLACES[id];
  const nova = !isVisited(id);
  const r = { id, nova, method, pontos: 0, base: p.calmo ? 20 : 20, mult: p.calmo ? 2 : 1, carimbo: null, emblema: false, n: penas() };
  if (nova) {
    state.visited.push({ id, nome: p.short });
    r.pontos = r.base * r.mult;
    state.pontos += r.pontos;
    if (p.carimbo && !state.carimbos.includes(p.carimbo)) { state.carimbos.push(p.carimbo); r.carimbo = p.carimbo; }
    if (id === 'camacha' && state.tasks.every(Boolean) && !state.emblema) { state.emblema = true; r.emblema = true; }
    r.n = penas();
  }
  state.lastReward = r;
  sfx(nova ? 'playFanfare' : 'playChime');
  current = 'recompensa'; render();
}

function openCaderneta(tab) { state.cadTab = tab; go('caderneta'); }
function setTab(tab) { state.cadTab = tab; sfx('playClick'); render(true); }

function redeem(id, cost) {
  if (state.redeemed.includes(id)) return;
  if (cost && state.pontos < cost) { toast(`Precisas de ${cost} pontos.`); return; }
  if (cost) state.pontos -= cost;
  state.redeemed.push(id);
  sfx('playChime');
  render(true);
  showVoucher(id);
}
function showVoucher(id) {
  const names = { cafe: 'Café «O Farol» (exemplo)', adega: 'Adega Tradicional (exemplo)', vime: 'Oficina de Vime (exemplo)' };
  const cells = Array.from({ length: 81 }, (_, i) => ((i * 7 + (i % 9) * 3 + (i >> 2)) % 3 === 0) ? 1 : 0);
  [0, 1, 2, 9, 10, 11, 18, 19, 20, 6, 7, 8, 15, 16, 17, 24, 25, 26, 54, 55, 56, 63, 64, 65, 72, 73, 74].forEach(i => cells[i] = 1);
  openModal(`<div class="text-center space-y-3">
    <div class="text-sm font-bold text-secondary-dark uppercase">Vale ativo</div>
    <h3 class="text-xl font-bold">${names[id]}</h3>

      ${cells.map(c => `<div class="${c ? 'bg-slate-900' : 'bg-white'} rounded-[1px]"></div>`).join('')}
    </div>

    <button data-close="1" onclick="closeModal(event)" class="w-full py-3 rounded-2xl bg-primary text-white font-bold">Fechar</button>
  </div>`);

function toggleMute() {

}
function setMusic() { state.music = !state.music; try { SoundSystem.toggleAmbient(state.music); } catch (e) {} render(true); }
function setSfx() { state.sfx = !state.sfx; try { SoundSystem.toggleSFX(state.sfx); } catch (e) {} render(true); }
function setVol(v) { state.volume = parseFloat(v); try { SoundSystem.setVolume(v); } catch (e) {} document.getElementById('vol-pct').textContent = Math.round(v * 100) + '%'; save(); }
function setFamily() { state.familyMode = !state.familyMode; if (state.familyMode) { state.kids = true; if (!state.cats.includes('familias')) state.cats.push('familias'); } sfx('playClick'); render(true); }
